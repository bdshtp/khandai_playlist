name: Build Khandai Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # chạy tự động mỗi giờ vào phút thứ 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run khandai.py
        run: python khandai.py

      - name: List files (debug)
        run: ls -R ${{ github.workspace }}

      - name: Commit and push m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add khandai.m3u
          git commit -m "Update khandai.m3u" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload khandai.m3u artifact
        uses: actions/upload-artifact@v4
        with:
          name: khandai-playlist
          path: ${{ github.workspace }}/khandai.m3u
