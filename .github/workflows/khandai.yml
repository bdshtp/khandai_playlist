name: Update Khandai M3U

on:
  schedule:
    # Chạy mỗi 20 phút
    - cron: "*/20 * * * *"
  workflow_dispatch:   # Cho phép bấm chạy tay

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run script
        run: |
          python khandai.py

      - name: Commit & Push nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add khandai.m3u
          if git diff --staged --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Update khandai.m3u $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
